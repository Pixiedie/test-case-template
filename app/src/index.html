<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <title>Simplis</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />

    <!-- Editorial Cobalt identity fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Instrument+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!--
    Anti-flash (FOUC): set data-theme BEFORE Angular boots, otherwise the
    page would show in light mode then flip to dark.
    The key must stay aligned with ThemeService (STORAGE_KEY).
  -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('Simplis-theme');
          var theme = stored || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
