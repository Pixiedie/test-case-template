<header class="subscription-header">
  @if (backLabel()) {
    <button type="button" class="subscription-header__back" (click)="back.emit()">
      ← {{ backLabel() }}
    </button>
  }

  <app-progress-bar [value]="currentStep()" [max]="totalSteps()" />

  <div class="subscription-header__text">
    <app-step-counter [current]="currentStep()" [total]="totalSteps()" />
    <h1 app-heading>{{ title() }}</h1>
    @if (subtitle()) {
      <p class="subscription-header__subtitle">{{ subtitle() }}</p>
    }
  </div>
</header>
