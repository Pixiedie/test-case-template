<form>
  <app-autocomplete-form
    name="activity"
    label="Quelle est votre activité professionnelle ?"
    [control]="form.controls.activity"
    [options]="options()"
    placeholder="Sélectionnez votre activité"
    (queryChange)="query.set($event)"
  />
</form>

<p>Valeur sélectionnée : {{ form.value.activity }}</p>
