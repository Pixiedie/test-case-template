<app-subscription-header
  [currentStep]="header().step"
  [totalSteps]="totalSteps"
  [title]="header().title"
  [subtitle]="header().subtitle"
  [backLabel]="backLabel()"
  (back)="onBack()"
/>

@if (view() === SubscriptionViewEnum.FORM) {
  <app-eligibility-form
    @slideOutLeft
    [form]="form"
    [activityOptions]="activityOptions()"
    [legalFormOptions]="legalFormOptions()"
    [turnoverOptions]="turnoverOptions()"
    [locationOptions]="locationOptions()"
    (queryChange)="query.set($event)"
    (showOffers)="showOffers()"
    (requestAdvisor)="requestAdvisor()"
  />
} @else if (view() === SubscriptionViewEnum.RESULTS) {
  <app-eligible-offers
    @slideInRight
    [bestFitCards]="bestFitCards()"
    [upsellCards]="upsellCards()"
    [hasNoOffer]="hasNoOffer()"
    (offerSelect)="onOfferSelect($event)"
    (requestAdvisor)="requestAdvisor()"
  />
} @else if (view() === SubscriptionViewEnum.SUBSCRIBER) {
  <app-subscriber-step
    @slideInRight
    [submitLabel]="subscriberSubmitLabel()"
    [offer]="subscriberOffer()"
    (formSubmit)="onSubscriberSubmit($event)"
  />
} @else if (view() === SubscriptionViewEnum.DONE) {
  <app-confirmation-step @slideInRight [offer]="selectedOffer()" [subscriber]="subscriber()" />
}
