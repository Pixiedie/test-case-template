<div class="select">
  <select
    class="select__control"
    [attr.id]="id()"
    [value]="value()"
    [disabled]="disabled()"
    (change)="select($any($event.target).value)"
    (blur)="markTouched()"
  >
    <option value="" disabled>{{ placeholder() }}</option>
    @for (option of options(); track option.value) {
      <option [value]="option.value">{{ option.label }}</option>
    }
  </select>
</div>
