<app-label [text]="label()" [htmlFor]="name()" />
<app-autocomplete
  [id]="name()"
  [formControl]="control()"
  [options]="options()"
  [placeholder]="placeholder()"
  [emptyActionLabel]="emptyActionLabel()"
  (queryChange)="queryChange.emit($event)"
  (selectionChange)="selectionChange.emit($event)"
  (emptyAction)="emptyAction.emit()"
/>
